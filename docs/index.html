<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Documentation LawApp — parcours, API backend, admin, présence QR." />
    <meta name="theme-color" content="#1976d2" />
    <title>LawApp — Documentation</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css" />
    <link rel="stylesheet" href="./assets/lawapp-docs.css" />
  </head>
  <body>
    <div id="app">Chargement de la documentation…</div>
    <script>
      window.$docsify = {
        name: 'LawApp',
        repo: '',
        homepage: 'README.md',
        loadSidebar: true,
        loadNavbar: false,
        coverpage: '_coverpage.md',
        onlyCover: false,
        auto2top: true,
        relativePath: true,
        subMaxLevel: 4,
        notFoundPage: true,
        search: {
          maxAge: 86400000,
          paths: 'auto',
          placeholder: 'Rechercher dans la doc…',
          noData: 'Aucun résultat',
          depth: 4,
        },
        copyCode: {
          buttonText: 'Copier',
          errorText: 'Erreur',
          successText: 'Copié',
        },
        pagination: {
          previousText: 'Précédent',
          nextText: 'Suivant',
          crossChapter: true,
        },
        mermaid: {
          theme: 'neutral',
        },
      }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2/dist/docsify-copy-code.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify-mermaid@2/dist/docsify-mermaid.js"></script>
  </body>
</html>
