<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="LawApp : évaluations sécurisées et Droit Ludique. Apprenez le droit en format court, type TikTok du droit." />
    <title>LawApp · Évaluations & Droit Ludique</title>
    <style>
      .boot-splash{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:#f8fafc;font-family:system-ui,sans-serif}
      .boot-splash__inner{display:flex;flex-direction:column;align-items:center;gap:.75rem}
      .boot-splash__logo{width:3.5rem;height:3.5rem;display:flex;align-items:center;justify-content:center;background:#1976d2;color:#fff}
      .boot-splash__title{font-size:1.5rem;font-weight:600;color:#0f172a;margin:0}
      .boot-splash__subtitle{font-size:.8125rem;color:#475569;margin:0}
      .boot-splash__bar{width:8rem;height:3px;margin-top:.5rem;background:#e2e8f0;overflow:hidden}
      .boot-splash__bar span{display:block;height:100%;width:40%;background:#1976d2;animation:boot-bar-slide 1.1s ease-in-out infinite}
      @keyframes boot-bar-slide{0%{transform:translateX(-120%)}100%{transform:translateX(320%)}}
    </style>
  </head>
  <body>
    <div id="boot-splash" class="boot-splash" aria-live="polite" aria-busy="true">
      <div class="boot-splash__inner">
        <div class="boot-splash__logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 3v18M5 10h14M7 6h10M9 14h6" />
          </svg>
        </div>
        <p class="boot-splash__title">LawApp</p>
        <p class="boot-splash__subtitle">Chargement de votre espace…</p>
        <div class="boot-splash__bar" aria-hidden="true"><span></span></div>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
