<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" fill="none" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a3d2e"/>
      <stop offset="45%" stop-color="#0f2918"/>
      <stop offset="100%" stop-color="#0a2f6b"/>
    </linearGradient>
    <linearGradient id="light" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#dcfce7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0a2f6b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d47a1"/>
      <stop offset="50%" stop-color="#166534"/>
      <stop offset="100%" stop-color="#0d47a1"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>
  <rect width="1920" height="540" fill="url(#light)"/>

  <!-- Fen�tres / lumi�re -->
  <g opacity="0.5">
    <rect x="180" y="120" width="120" height="280" fill="#bbf7d0" opacity="0.08"/>
    <rect x="420" y="80" width="140" height="320" fill="#86efac" opacity="0.1"/>
    <rect x="680" y="100" width="100" height="300" fill="#bbf7d0" opacity="0.07"/>
    <rect x="1180" y="90" width="160" height="310" fill="#60a5fa" opacity="0.12"/>
    <rect x="1480" y="110" width="110" height="290" fill="#bbf7d0" opacity="0.08"/>
  </g>

  <!-- Biblioth�que / colonnes -->
  <g opacity="0.65">
    <rect x="0" y="420" width="90" height="660" fill="#0a1f14"/>
    <rect x="160" y="380" width="70" height="700" fill="#0f2918"/>
    <rect x="320" y="400" width="55" height="680" fill="#0a1f14"/>
    <rect x="1540" y="390" width="80" height="690" fill="#0f2918"/>
    <rect x="1720" y="410" width="200" height="670" fill="#0a1f14"/>
  </g>

  <!-- Rayonnages -->
  <g opacity="0.45" stroke="#1565c0" stroke-width="1">
    <path d="M240 480h520M240 540h520M240 600h520M240 660h520M240 720h520"/>
    <path d="M980 460h480M980 520h480M980 580h480M980 640h480M980 700h480"/>
  </g>

  <!-- Sol -->
  <rect y="820" width="1920" height="260" fill="url(#floor)" opacity="0.9"/>
  <ellipse cx="960" cy="900" rx="720" ry="80" fill="#0a2f6b" opacity="0.5" filter="url(#blur)"/>

  <!-- Balance de justice (silhouette) -->
  <g transform="translate(960 620)" opacity="0.18">
    <path d="M0 120V-80" stroke="#dcfce7" stroke-width="3"/>
    <path d="M-100 120h200" stroke="#60a5fa" stroke-width="2"/>
    <path d="M-100 120L-130 20h60l30 40" stroke="#1976d2" stroke-width="2" fill="none"/>
    <path d="M100 120L130 20h-60l-30 40" stroke="#1976d2" stroke-width="2" fill="none"/>
    <rect x="-20" y="-100" width="40" height="12" fill="#1565c0"/>
  </g>

  <!-- Vignette -->
  <rect width="1920" height="1080" fill="url(#sky)" opacity="0.15"/>
</svg>
